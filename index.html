<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Український Дворик — Меню</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .header h1 span {
            color: #e67e22;
        }
        .search-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .search-container input {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .search-container input:focus {
            border-color: #e67e22;
            box-shadow: 0 2px 8px rgba(230,126,34,0.2);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }
        .tab-btn:hover, .tab-btn.active {
            background: #e67e22;
            color: #fff;
            border-color: #e67e22;
        }
        .dishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .dish-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }
        .dish-card:hover {
            transform: translateY(-5px);
        }
        .dish-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .dish-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .dish-info h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: #e67e22;
            margin-bottom: 8px;
        }
        .description {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Український <span>Дворик</span></h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Пошук страви...">
        </div>
    </header>

    <main class="container">
        <!-- Кнопки категорій (Напої, Випічка та Соуси у самому кінці) -->
        <div class="categories">
            <button class="tab-btn active" data-category="Всі">Всі</button>
            <button class="tab-btn" data-category="Перші страви">Перші страви</button>
            <button class="tab-btn" data-category="Салати">Салати</button>
            <button class="tab-btn" data-category="Другі страви">Другі страви</button>
            <button class="tab-btn" data-category="Закуски">Закуски</button>
            <button class="tab-btn" data-category="Напої">Напої</button>
            <button class="tab-btn" data-category="Випічка">Випічка</button>
            <button class="tab-btn" data-category="Соуси">Соуси</button>
        </div>

        <!-- Контейнер для карток страв -->
        <div class="dishes-grid" id="dishesGrid"></div>
    </main>

            { id: 30, name: "Суп грибний", category: "Перші страви", price: 105, description: "Насичений грибний суп (450г)", image: "img/mushroom-soup.jpg" },
            { id: 31, name: "Борщ зелений", category: "Перші страви", price: 100, description: "Традиційний зелений борщ зі сметаною (450г)", image: "img/borsch.jpg" },

            // --- Салати ---
            { id: 7, name: "Салат «Грецький»", category: "Салати", price: 110, description: "Свіжі овочі, фета, оливки", image: "img/greek-salad.jpg" },
            { id: 8, name: "Салат з буряка", category: "Салати", price: 75, description: "Корисний буряковий салат", image: "img/beetroot-salad.jpg" },

            { id: 11, name: "М'ясна сковорідка", category: "Другі страви", price: 180, description: "Гаряча сковорідка з м'ясом та овочами", image: "img/meat-skillet.jpg" },
            { id: 12, name: "Картопляне пюре з гуляшом", category: "Другі страви", price: 140, description: "Ніжне пюре з соковитим гуляшом", image: "img/mashed-potatoes-goulash.jpg" },

            { id: 21, name: "Пельмені", category: "Другі страви", price: 110, description: "Домашні пельмені з маслом або сметаною", image: "img/pelmeni.jpg" },
            { id: 24, name: "Відбивна курина", category: "Другі страви", price: 125, description: "Соковита куряча відбивна в паніровці", image: "img/chicken-cutlet.jpg" },
            { id: 27, name: "Голубці", category: "Другі страви", price: 140, description: "Домашні голубці з м'ясом та рисом у капустяному листі", image: "img/cabbage-rolls.jpg" },

            // --- Закуски ---
            { id: 13, name: "Холодець", category: "Закуски", price: 95, description: "Домашній холодець з хріном", image: "img/kholodets.jpg" },
            { id: 22, name: "Омлет", category: "Закуски", price: 65, description: "Пишний класичний омлет", image: "img/omelette.jpg" },

            { id: 40, name: "Пиріжки з картоплею", category: "Випічка", price: 35, description: "Домашні пиріжки (1 шт.)" },
            { id: 41, name: "Пиріжки з капустою", category: "Випічка", price: 35, description: "Пиріжки з тушкованою капустою (1 шт.)" },
            { id: 42, name: "Біляші", category: "Випічка", price: 48, description: "Соковиті м'ясні біляші (1 шт.)" },
            { id: 43, name: "Торт «Наполеон»", category: "Випічка", price: 65, description: "Класичний багатошаровий торт (100г)" },
            { id: 44, name: "Торт «Медовик»", category: "Випічка", price: 60, description: "Ніжний медовий торт (100г)" },

            // --- Напої та Соуси (у самому низу) ---
            { id: 32, name: "Компот", category: "Напої", price: 36, description: "Домашній компот (250г)" },
            { id: 33, name: "Сік", category: "Напої", price: 40, description: "Натуральний сік (250г)" },
            { id: 34, name: "Чай в асортименті", category: "Напої", price: 25, description: "Гарячий чай на вибір" },
            { id: 35, name: "Кава в асортименті", category: "Напої", price: 35, description: "Ароматна кава" },
            { id: 45, name: "Сметана", category: "Соуси", price: 0, description: "Свіжа сметана" },
            { id: 46, name: "Майонез", category: "Соуси", price: 0, description: "Класичний майонез" },
            { id: 47, name: "Кетчуп", category: "Соуси", price: 0, description: "Томатний кетчуп" },
            { id: 48, name: "Оцет", category: "Соуси", price: 0, description: "Столовий оцет" },
            { id: 49, name: "Згущене молоко", category: "Соуси", price: 0, description: "Солодке згущене молоко" }
        ];

        function renderDishes(items) {
            const grid = document.getElementById('dishesGrid');
            grid.innerHTML = '';

            items.forEach(dish => {
                const card = document.createElement('div');
                card.classList.add('dish-card');
                
                card.innerHTML = `
                    <img src="${dish.image}" alt="${dish.name}">
                    <div class="dish-info">
                        <div>
                            <h3>${dish.name}</h3>
                            <p class="description">${dish.description}</p>
                        </div>
                        <p class="price">${dish.price} ₴</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Фільтрація за категоріями
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                buttons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');

                const category = e.target.getAttribute('data-category');
                if (category === 'Всі') {
                    renderDishes(dishes);
                } else {
                    const filtered = dishes.filter(dish => dish.category === category);
                    renderDishes(filtered);
                }
            });
        });

        // Пошук по назві
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = dishes.filter(dish => dish.name.toLowerCase().includes(query));
            renderDishes(filtered);
        });

        // Початкове завантаження
        renderDishes(dishes);
    </script>
</body>
</html>
