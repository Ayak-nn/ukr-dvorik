<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Український Дворик — Меню</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 22px;
        }
        .header h1 {
            font-size: 2.1rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .header h1 span {
            color: #e67e22;
        }
        .search-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .search-container input {
            width: 100%;
            padding: 10px 18px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .search-container input:focus {
            border-color: #e67e22;
            box-shadow: 0 2px 8px rgba(230,126,34,0.2);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #2c3e50;
            transition: 0.25s;
        }
        .tab-btn:hover, .tab-btn.active {
            background: #e67e22;
            color: #fff;
            border-color: #e67e22;
        }
        .dishes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            align-items: start;
        }
        .dish-card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        /* Контейнер фото */
        .dish-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #ece6de;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dish-img-bg {
            position: absolute;
            inset: -12px;
            width: calc(100% + 24px);
            height: calc(100% + 24px);
            object-fit: cover;
            filter: blur(12px) brightness(0.92);
            opacity: 0.65;
            pointer-events: none;
        }
        /* Базовое приближение для всех блюд (+18%) */
        .dish-img-main {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center center;
            transform: scale(1.18);
            display: block;
            transition: transform 0.25s ease;
        }

        .dish-info {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-grow: 1;
            background: #fff;
            position: relative;
            z-index: 2;
        }
        .dish-info h3 {
            font-size: 1.02rem;
            line-height: 1.3;
            color: #2c3e50;
            margin: 0;
        }
        .price {
            font-size: 1.12rem;
            font-weight: 700;
            color: #e67e22;
            white-space: nowrap;
            margin: 0;
        }

        @media (max-width: 540px) {
            body {
                padding: 10px;
            }
            .header h1 {
                font-size: 1.7rem;
            }
            .dishes-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .dish-img-wrap {
                aspect-ratio: 1 / 1;
            }
            .dish-info {
                padding: 9px 10px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .dish-info h3 {
                font-size: 0.92rem;
            }
            .price {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

        function renderDishes(items) {
            const grid = document.getElementById('dishesGrid');
            grid.innerHTML = '';

            const cleanItems = items.filter(dish => {
                const nameLower = (dish.name || '').toLowerCase();
                const catLower = (dish.category || '').trim().toLowerCase();
                return !nameLower.includes('наполеон')
                    && !nameLower.includes('медовик')
                    && catLower !== 'закуски';
            });

            cleanItems.forEach(dish => {
                const card = document.createElement('div');
                card.classList.add('dish-card');

                const noPhotoCategories = ['напої', 'соуси'];
                const isNoPhotoCategory = noPhotoCategories.includes((dish.category || '').trim().toLowerCase());
                const hasValidImage = !isNoPhotoCategory && dish.image && dish.image.trim() !== '';

                const scaleVal = dish.scale || 1.18;
                const scaleStyle = `transform: scale(${scaleVal});`;
                const posStyle = dish.pos ? `object-position: ${dish.pos};` : '';

                const imgHtml = hasValidImage
                    ? `<div class="dish-img-wrap">
                           <img class="dish-img-bg" src="${dish.image}" alt="" aria-hidden="true">
                           <img class="dish-img-main" src="${dish.image}" alt="${dish.name}" loading="lazy" style="${scaleStyle} ${posStyle}">
                       </div>`
                    : '';

                const prefix = dish.pricePrefix || '';

                card.innerHTML = `
                    ${imgHtml}
                    <div class="dish-info">
                        <h3>${dish.name}</h3>
                        <p class="price">${prefix}${dish.price} ₴</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        const buttons = document.querySelectorAll('.tab-btn');
        const searchInput = document.getElementById('searchInput');

        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                buttons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                searchInput.value = '';

                const category = e.target.getAttribute('data-category');
                if (category === 'Всі') {
                    renderDishes(dishes);
                } else {
                    const filtered = dishes.filter(dish => dish.category === category);
                    renderDishes(filtered);
                }
            });
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const activeBtn = document.querySelector('.tab-btn.active');
            const activeCategory = activeBtn ? activeBtn.getAttribute('data-category') : 'Всі';

            const filtered = dishes.filter(dish => {
                const matchesCategory = activeCategory === 'Всі' || dish.category === activeCategory;
                const matchesSearch = dish.name.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            renderDishes(filtered);
        });

        renderDishes(dishes);
    </script>
