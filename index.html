<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Український Дворик - Меню</title>
    <!-- Підключаємо стилі (за потреби можеш замінити на свій шлях) -->
    <link rel="stylesheet" href="style.css">
    <!-- Підключаємо Supabase JS клиент через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header">
        <h1>Український <span>Дворик</span></h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Пошук страви...">
        </div>
    </header>

    <main class="container">
        <!-- Кнопки категорій (Напої, Випічка та Соуси у самому кінці) -->
        <div class="categories">
            <button class="tab-btn active" data-category="Всі">Всі</button>
            <button class="tab-btn" data-category="Перші страви">Перші страви</button>
            <button class="tab-btn" data-category="Салати">Салати</button>
            <button class="tab-btn" data-category="Другі страви">Другі страви</button>
            <button class="tab-btn" data-category="Закуски">Закуски</button>
            <button class="tab-btn" data-category="Напої">Напої</button>
            <button class="tab-btn" data-category="Випічка">Випічка</button>
            <button class="tab-btn" data-category="Соуси">Соуси</button>
        </div>

        <!-- Контейнер куди будуть динамічно завантажуватись страви з бази -->
        <div class="dishes-grid" id="dishesGrid">
            <!-- Тут з'являтимуться картки страв -->
        </div>
    </main>

    <!-- Скрипт для підключення до Supabase та виведення меню -->
    <script>
        // Твої дані підключення до Supabase
        const SUPABASE_URL = 'ТУТ_МАЄ_БУТИ_ТВІЙ_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'ТУТ_МАЄ_БУТИ_ТВІЙ_SUPABASE_ANON_KEY';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allDishes = [];

        async function fetchDishes() {
            const { data, error } = await _supabase.from('dishes').select('*').order('id', { ascending: true });
            if (error) {
                console.error('Помилка завантаження страв:', error);
                return;
            }
            allDishes = data;
            renderDishes(allDishes);
        }

        function renderDishes(dishes) {
            const grid = document.getElementById('dishesGrid');
            grid.innerHTML = '';

            dishes.forEach(dish => {
                const card = document.createElement('div');
                card.classList.add('dish-card');
                
                card.innerHTML = `
                    <img src="${dish.image || 'img/borsch.jpg'}" alt="${dish.name}">
                    <div class="dish-info">
                        <h3>${dish.name}</h3>
                        <p class="price">${dish.price} ₴</p>
                        <p class="description">${dish.description || ''}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Фільтрація за категоріями
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                buttons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');

                const category = e.target.getAttribute('data-category');
                if (category === 'Всі') {
                    renderDishes(allDishes);
                } else {
                    const filtered = allDishes.filter(dish => dish.category === category);
                    renderDishes(filtered);
                }
            });
        });

        // Пошук по назві
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allDishes.filter(dish => dish.name.toLowerCase().includes(query));
            renderDishes(filtered);
        });

        // Завантажуємо страви при старті сторінки
        fetchDishes();
    </script>
</body>
</html>
