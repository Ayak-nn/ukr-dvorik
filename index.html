<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Український Дворик — Меню</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            padding: 16px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2.1rem;
            color: #2c3e50;
            margin-bottom: 12px;
        }
        .header h1 span {
            color: #e67e22;
        }
        .search-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .search-container input {
            width: 100%;
            padding: 10px 18px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.25s;
        }
        .search-container input:focus {
            border-color: #e67e22;
            box-shadow: 0 2px 8px rgba(230,126,34,0.2);
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 22px;
        }
        .tab-btn {
            padding: 8px 16px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            color: #2c3e50;
            transition: 0.2s;
        }
        .tab-btn:hover, .tab-btn.active {
            background: #e67e22;
            color: #fff;
            border-color: #e67e22;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu-item {
            background: #fff;
            border-radius: 10px;
            padding: 12px 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }
        .menu-item h3 {
            font-size: 1.02rem;
            font-weight: 500;
            color: #2c3e50;
            line-height: 1.3;
        }
        .price {
            font-size: 1.08rem;
            font-weight: 700;
            color: #e67e22;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Український <span>Дворик</span></h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Пошук страви...">
        </div>
    </header>

    <main class="container">
        <div class="categories">
            <button class="tab-btn active" data-category="Всі">Всі</button>
            <button class="tab-btn" data-category="Перші страви">Перші страви</button>
            <button class="tab-btn" data-category="М'ясні страви">М'ясні страви</button>
            <button class="tab-btn" data-category="Другі страви">Другі страви</button>
            <button class="tab-btn" data-category="Салати">Салати</button>
            <button class="tab-btn" data-category="Випічка">Випічка</button>
            <button class="tab-btn" data-category="Напої">Напої</button>
            <button class="tab-btn" data-category="Соуси">Соуси</button>
        </div>

        <div class="menu-list" id="dishesGrid"></div>
    </main>

    <script>
        const dishes = [
            // --- Перші страви ---
            { id: 28, name: "Суп з домашньою локшиною (450г)", category: "Перші страви", price: 84 },
            { id: 29, name: "Суп з фрикадельками (450г)", category: "Перші страви", price: 84 },
            { id: 2, name: "Суп гороховий (450г)", category: "Перші страви", price: 84 },
            { id: 54, name: "Харчо (450г)", category: "Перші страви", price: 84 },
            { id: 30, name: "Суп грибний (450г)", category: "Перші страви", price: 105 },
            { id: 1, name: "Борщ червоний (450г)", category: "Перші страви", price: 100 },
            { id: 31, name: "Борщ зелений (450г)", category: "Перші страви", price: 100 },
            { id: 3, name: "Солянка (450г)", category: "Перші страви", price: 116 },
            { id: 6, name: "Бограч (450г)", category: "Перші страви", price: 158 },
            { id: 5, name: "Окрошка (450г)", category: "Перші страви", price: 100 },

            // --- М'ясні страви ---
            { id: 53, name: "Відбивна свинна (100г)", category: "М'ясні страви", price: 80 },
            { id: 24, name: "Відбивна куряча (100г)", category: "М'ясні страви", price: 70 },
            { id: 18, name: "Відбивна по-французьки", category: "М'ясні страви", price: 80 },
            { id: 52, name: "Піджарка (150г)", category: "М'ясні страви", price: 102 },
            { id: 11, name: "М'ясна сковорідка (250г)", category: "М'ясні страви", price: 216 },
            { id: 20, name: "Риба в клярі (100г)", category: "М'ясні страви", price: 70 },
            { id: 27, name: "Голубці (250г)", category: "М'ясні страви", price: 111 },

            // --- Другі страви ---
            { id: 19, name: "Картопляна запіканка", category: "Другі страви", price: 111 },
            { id: 51, name: "Картопляне пюре (250г)", category: "Другі страви", price: 46 },
            { id: 14, name: "Картопля фри (150г)", category: "Другі страви", price: 80 },
            { id: 10, name: "Картопля по-селянськи (150г)", category: "Другі страви", price: 80 },
            { id: 17, name: "Деруни (300г)", category: "Другі страви", price: 100 },
            { id: 13, name: "Холодець (250г)", category: "Другі страви", price: 95 },
            { id: 22, name: "Омлет (з 2 яєць)", category: "Другі страви", price: 60 },
            { id: 21, name: "Пельмені домашні", category: "Другі страви", price: 96 },
            { id: 50, name: "Карасик смажений (100г)", category: "Другі страви", price: 40 },

            // --- Салати ---
            { id: 25, name: "Салат з капусти свіжої (200г)", category: "Салати", price: 56 },
            { id: 9, name: "Салат з капусти квашеної маринованої", category: "Салати", price: 59 },
            { id: 37, name: "Салат з буряка (300г)", category: "Салати", price: 70 },
            { id: 23, name: "Салат «Овочевий» (250г)", category: "Салати", price: 75 },
            { id: 38, name: "Салат «Вінегрет» (250г)", category: "Салати", price: 75 },
            { id: 26, name: "Салат «Олів'є» (300г)", category: "Салати", price: 88 },
            { id: 16, name: "Салат «Крабовий» (300г)", category: "Салати", price: 88 },
            { id: 39, name: "Салат «Шуба» (300г)", category: "Салати", price: 100 },
            { id: 7, name: "Салат «Грецький» (250г)", category: "Салати", price: 100 },
            { id: 15, name: "Гриби тушковані в сливках (100г)", category: "Салати", price: 70 },

            // --- Випічка ---
            { id: 40, name: "Пиріжки з картоплею (1 шт.)", category: "Випічка", price: 35 },
            { id: 41, name: "Пиріжки з капустою (1 шт.)", category: "Випічка", price: 35 },
            { id: 42, name: "Біляші (1 шт.)", category: "Випічка", price: 48 },

            // --- Напої ---
            { id: 32, name: "Компот (250г)", category: "Напої", price: 36 },
            { id: 33, name: "Сік (250г)", category: "Напої", price: 40 },
            { id: 34, name: "Чай в асортименті", category: "Напої", price: 25 },
            { id: 35, name: "Кава в асортименті", category: "Напої", price: 35 },

            // --- Соуси ---
            { id: 45, name: "Сметана", category: "Соуси", price: 0 },
            { id: 46, name: "Майонез", category: "Соуси", price: 0 },
            { id: 47, name: "Кетчуп", category: "Соуси", price: 0 },
            { id: 48, name: "Оцет", category: "Соуси", price: 0 },
            { id: 49, name: "Згущене молоко", category: "Соуси", price: 0 }
        ];

        function renderDishes(items) {
            const list = document.getElementById('dishesGrid');
            list.innerHTML = '';

            const cleanItems = items.filter(dish => {
                const nameLower = (dish.name || '').toLowerCase();
                const catLower = (dish.category || '').trim().toLowerCase();
                return !nameLower.includes('наполеон')
                    && !nameLower.includes('медовик')
                    && catLower !== 'закуски';
            });

            cleanItems.forEach(dish => {
                const row = document.createElement('div');
                row.classList.add('menu-item');
                row.innerHTML = `
                    <h3>${dish.name}</h3>
                    <span class="price">${dish.price} ₴</span>
                `;
                list.appendChild(row);
            });
        }

        const buttons = document.querySelectorAll('.tab-btn');
        const searchInput = document.getElementById('searchInput');

        buttons.forEach(button => {
            button.addEventListener('click', (e) => {
                buttons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                searchInput.value = '';

                const category = e.target.getAttribute('data-category');
                if (category === 'Всі') {
                    renderDishes(dishes);
                } else {
                    const filtered = dishes.filter(dish => dish.category === category);
                    renderDishes(filtered);
                }
            });
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const activeBtn = document.querySelector('.tab-btn.active');
            const activeCategory = activeBtn ? activeBtn.getAttribute('data-category') : 'Всі';

            const filtered = dishes.filter(dish => {
                const matchesCategory = activeCategory === 'Всі' || dish.category === activeCategory;
                const matchesSearch = dish.name.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });
            renderDishes(filtered);
        });

        renderDishes(dishes);
    </script>
</body>
</html>
