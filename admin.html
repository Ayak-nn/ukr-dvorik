<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель — Український Дворик</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8f9fa; padding: 20px; color: #1a1d20; }
    .container { max-width: 700px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { font-size: 22px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #edf2f7; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    button { background: #85a029; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    button:hover { background: #657e1a; }
    .logout-btn { background: #dc3545; }
    .logout-btn:hover { background: #bb2d3b; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border-bottom: 1px solid #edf2f7; text-align: left; font-size: 14px; }
    th { background: #f3f7e6; color: #657e1a; }
    .hidden { display: none; }
    .error { color: #e63946; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- ФОРМА ВХОДА -->
    <div id="loginSection">
      <h2>Вхід для адміністратора</h2>
      <div class="form-group">
        <label>Електронна пошта</label>
        <input type="email" id="email" placeholder="admin@dvorik.com">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <button onclick="login()">Увійти</button>
      <div id="errorMsg" class="error"></div>
    </div>

    <!-- АДМИН-ПАНЕЛЬ -->
    <div id="adminSection" class="hidden">
      <div class="header-row">
        <h2>Керування цінами меню</h2>
        <button class="logout-btn" onclick="logout()">Вийти</button>
      </div>
      <p style="color: #6c757d; font-size: 13px; margin-bottom: 15px;">Змініть ціну у полі та натисніть «Зберегти».</p>
      <table>
        <thead>
          <tr>
            <th>Страва</th>
            <th>Категорія</th>
            <th>Ціна (₴)</th>
            <th>Дія</th>
          </tr>
        </thead>
        <tbody id="adminMenuTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    // Проверка наличия сохраненного токена при открытии страницы
    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('adminToken');
      if (token) {
        showAdminPanel();
      }
    });

    // Функция входа
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      try {
        const res = await fetch('http://localhost:3000/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (data.success) {
          // Сохраняем полученный защищенный токен в браузере
          localStorage.setItem('adminToken', data.token);
          showAdminPanel();
        } else {
          errorMsg.textContent = data.message || 'Невірна пошта або пароль!';
        }
      } catch (err) {
        errorMsg.textContent = 'Помилка підключення до сервера.';
      }
    }

    // Отображение панели и загрузка меню
    function showAdminPanel() {
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('adminSection').classList.remove('hidden');
      loadAdminMenu();
    }

    // Выход из админки (удаление токена)
    function logout() {
      localStorage.removeItem('adminToken');
      document.getElementById('adminSection').classList.add('hidden');
      document.getElementById('loginSection').classList.remove('hidden');
    }

    // Загрузка списка блюд
    async function loadAdminMenu() {
      const res = await fetch('http://localhost:3000/api/dishes');
      const dishes = await res.json();
      
      const tbody = document.getElementById('adminMenuTable');
      tbody.innerHTML = dishes.map(dish => `
        <tr>
          <td><b>${dish.name}</b></td>
          <td>${dish.category}</td>
          <td><input type="number" id="price-${dish.id}" value="${dish.price}" style="width: 80px;"></td>
          <td><button onclick="updatePrice(${dish.id})">Зберегти</button></td>
        </tr>
      `).join('');
    }

    // Сохранение новой цены (передает токен в заголовке Authorization)
    async function updatePrice(id) {
      const newPrice = document.getElementById(`price-${id}`).value;
      const token = localStorage.getItem('adminToken');

      const res = await fetch('http://localhost:3000/api/dishes/update-price', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}` // Передаем цифровой пропуск
        },
        body: JSON.stringify({ id, newPrice })
      });

      const data = await res.json();
      if (res.ok && data.success) {
        alert('Ціну успішно оновлено!');
      } else {
        alert('Помилка: ' + (data.message || 'Немає доступу!'));
        if (res.status === 401 || res.status === 403) {
          logout(); // Если токен недействителен, сбрасываем вход
        }
      }
    }
  </script>
</body>
</html>
